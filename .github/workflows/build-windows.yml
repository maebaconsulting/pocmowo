name: Build Windows installer

# Compile l'installeur Windows NSIS (.exe) sur un runner Windows.
# Déclenchement :
#   - en poussant un tag de version (ex. v1.0.0) -> publie une Release avec l'installeur ;
#   - manuellement via l'onglet Actions (bouton « Run workflow ») -> installeur en artefact.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Installation de Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Installation des dépendances
        run: pnpm install --frozen-lockfile

      - name: Compilation de l'installeur (NSIS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: "--bundles nsis"
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "CAMPOST Core Banking ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false

      - name: Publication de l'installeur en artefact
        uses: actions/upload-artifact@v4
        with:
          name: CAMPOST-Windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
